<!DOCTYPE html>
<html>
<head>
    <title>HTML & CSS Example</title>
    <link rel="stylesheet" href="Lab-Experiment-2.css">
</head>
<body>
    <h1>My First Webpage</h1>
    <p>This is a paragraph styled with CSS.</p>

    <h2>Links</h2>
    <a href="https://www.mu.edu.sa/ar">This is a link</a>

    <h2>Image</h2>
    <img src="Official_CSS_Logo.svg.png"  height="200" alt="Placeholder Image">

    <h2>Table</h2>
    <table>
        <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Apple</td>
                <td>$5</td>
            </tr>
            <tr>
                <td>Banana</td>
                <td>$3</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">Total: $8</td>
            </tr>
        </tfoot>
    </table>

    <h2>Form</h2>
    <form>
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name"><br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender" value="Male"> Male<br>
        <input type="radio" name="gender" value="Female"> Female<br><br>

        <label>Hobbies:</label><br>
        <input type="checkbox" name="hobby" value="Football"> Football<br>
        <input type="checkbox" name="hobby" value="Basketball"> Basketball<br><br>

        <label for="description">Description:</label><br>
        <textarea id="description" name="description" rows="4" cols="50">Enter description here...</textarea><br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
