<!DOCTYPE html>
<html>
<head>
  <title>Even Numbers</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
  </style>
</head>
<body>

  <h3>Even numbers between 1 and 100:</h3>
  <p id="result"></p>

  <script>
    let text = "";
    for (let i = 1; i <= 100; i++) {
      if (i % 2 == 0) {
        text += i + " ";
      }
    }
    document.getElementById("result").textContent = text;
  </script>

</body>
</html>
